<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="app-body" class="bg-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    
    <div id="calc-card" class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-80 border border-slate-700 relative transition-colors duration-300">
        
        <!-- Header & Theme Toggle -->
        <div class="flex items-center justify-between mb-4">
            <h1 id="calc-title" class="text-white font-bold text-xl transition-colors duration-300">Simple Calculator</h1>
            
            <!-- Toggle Button -->
            <button onclick="toggleTheme()" id="theme-btn" class="p-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-amber-400 transition-colors duration-300 focus:outline-none" title="Toggle Day/Night Mode">
                <span id="theme-icon" class="text-lg">☀️</span>
            </button>
        </div>

        <!-- Display Screen -->
        <div id="screen-container" class="bg-slate-950 text-right p-4 rounded-xl mb-4 border border-slate-700 transition-colors duration-300">
            <div id="equation" class="text-slate-400 text-xs h-4"></div>
            <div id="display" class="text-white text-3xl font-mono truncate">0</div>
        </div>

        <!-- Button Grid -->
        <div class="grid grid-cols-4 gap-2">
            <button onclick="clearAll()" class="col-span-2 bg-rose-600 hover:bg-rose-500 text-white p-3 rounded-lg font-semibold transition">Clear</button>
            <button onclick="appendOperator('/')" class="bg-amber-600 hover:bg-amber-500 text-white p-3 rounded-lg font-semibold transition">÷</button>
            <button onclick="appendOperator('*')" class="bg-amber-600 hover:bg-amber-500 text-white p-3 rounded-lg font-semibold transition">×</button>

            <button onclick="appendNumber('7')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">7</button>
            <button onclick="appendNumber('8')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">8</button>
            <button onclick="appendNumber('9')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">9</button>
            <button onclick="appendOperator('-')" class="bg-amber-600 hover:bg-amber-500 text-white p-3 rounded-lg font-semibold transition">-</button>

            <button onclick="appendNumber('4')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">4</button>
            <button onclick="appendNumber('5')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">5</button>
            <button onclick="appendNumber('6')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">6</button>
            <button onclick="appendOperator('+')" class="bg-amber-600 hover:bg-amber-500 text-white p-3 rounded-lg font-semibold transition">+</button>

            <button onclick="appendNumber('1')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">1</button>
            <button onclick="appendNumber('2')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">2</button>
            <button onclick="appendNumber('3')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">3</button>
            <button onclick="calculateResult()" class="row-span-2 bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-lg font-semibold transition flex items-center justify-center">=</button>

            <button onclick="appendNumber('0')" class="num-btn col-span-2 bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">0</button>
            <button onclick="appendNumber('.')" class="num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition">.</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let equation = document.getElementById('equation');
        let currentInput = '0';
        let currentEquation = '';
        let isDarkMode = true;

        function updateDisplay() {
            display.innerText = currentInput;
            equation.innerText = currentEquation;
        }

        function appendNumber(num) {
            if (currentInput === '0' || currentInput === 'Error') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            currentEquation = currentInput + ' ' + op + ' ';
            currentInput = '0';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            currentEquation = '';
            updateDisplay();
        }

        function calculateResult() {
            try {
                let fullExpr = currentEquation + currentInput;
                let result = eval(fullExpr);
                currentInput = String(result);
                currentEquation = '';
                updateDisplay();
            } catch (err) {
                currentInput = 'Error';
                currentEquation = '';
                updateDisplay();
            }
        }

        // Toggle Day / Night Theme
        function toggleTheme() {
            isDarkMode = !isDarkMode;

            const body = document.getElementById('app-body');
            const card = document.getElementById('calc-card');
            const title = document.getElementById('calc-title');
            const screen = document.getElementById('screen-container');
            const themeBtn = document.getElementById('theme-btn');
            const themeIcon = document.getElementById('theme-icon');
            const numBtns = document.querySelectorAll('.num-btn');

            if (isDarkMode) {
                // Night Mode Styling
                body.className = "bg-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300";
                card.className = "bg-slate-800 p-6 rounded-2xl shadow-2xl w-80 border border-slate-700 relative transition-colors duration-300";
                title.className = "text-white font-bold text-xl transition-colors duration-300";
                screen.className = "bg-slate-950 text-right p-4 rounded-xl mb-4 border border-slate-700 transition-colors duration-300";
                display.className = "text-white text-3xl font-mono truncate";
                themeBtn.className = "p-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-amber-400 transition-colors duration-300 focus:outline-none";
                themeIcon.innerText = "☀️";

                numBtns.forEach(btn => {
                    btn.className = "num-btn bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-semibold transition" + (btn.innerText === '0' ? " col-span-2" : "");
                });
            } else {
                // Day Mode Styling
                body.className = "bg-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300";
                card.className = "bg-white p-6 rounded-2xl shadow-2xl w-80 border border-slate-200 relative transition-colors duration-300";
                title.className = "text-slate-800 font-bold text-xl transition-colors duration-300";
                screen.className = "bg-slate-100 text-right p-4 rounded-xl mb-4 border border-slate-300 transition-colors duration-300";
                display.className = "text-slate-800 text-3xl font-mono truncate";
                themeBtn.className = "p-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 transition-colors duration-300 focus:outline-none";
                themeIcon.innerText = "🌙";

                numBtns.forEach(btn => {
                    btn.className = "num-btn bg-slate-200 hover:bg-slate-300 text-slate-800 p-3 rounded-lg font-semibold transition" + (btn.innerText === '0' ? " col-span-2" : "");
                });
            }
        }
    </script>
</body>
</html>
